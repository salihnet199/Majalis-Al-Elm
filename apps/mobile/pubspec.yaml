name: mobile
description: "Majlis Al-Alim Educational & Religious Platform Flutter Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network & API
  dio: ^5.4.3+1

  # Local Storage & Security
  flutter_secure_storage: ^9.2.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Routing & Navigation
  go_router: ^14.2.0

  # UI, Styling & Localization
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # Media Viewers & Player
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  pdfx: ^2.6.0
  cached_network_image: ^3.3.1
  equatable: ^2.0.5

  # Push & Local Notifications
  firebase_core: ^2.30.0
  firebase_messaging: ^14.8.0
  flutter_local_notifications: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
