name: CI — Lint · Type-Check · Test · Build

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  NX_CLOUD_ACCESS_TOKEN: ''   # intentionally empty — no Nx Cloud in Phase 1

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: majalis_elm_test
          POSTGRES_USER: majalis_elm
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for nx affected

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Nx SHAs (for affected commands)
        uses: nrwl/nx-set-shas@v4

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint (affected)
        run: npx nx affected --target=lint --parallel=3

      # ── Type Check ──────────────────────────────────────────────────────────
      - name: Type Check (affected)
        run: npx nx affected --target=type-check --parallel=3

      # ── Unit Tests ──────────────────────────────────────────────────────────
      - name: Validate migrations
        run: node scripts/migrate-validate.mjs

      - name: Unit Tests (affected)
        run: npx nx affected --target=test --parallel=3 --ci --coverage
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: majalis_elm_test
          DATABASE_USER: majalis_elm
          DATABASE_PASSWORD: test_password
          JWT_ACCESS_TOKEN_TTL: 900
          JWT_REFRESH_TOKEN_TTL: 604800

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build (affected)
        run: npx nx affected --target=build --parallel=3

      # ── Flutter Mobile Validation ───────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/mobile

      - name: Flutter analyze
        run: flutter analyze
        working-directory: apps/mobile

      - name: Flutter tests
        run: flutter test
        working-directory: apps/mobile

      - name: Flutter Android release build
        run: flutter build apk --release
        working-directory: apps/mobile

      # ── End-to-End Smoke Test ────────────────────────────────────────────────
      # Starts backend with NODE_ENV=test, so JWT/storage test-only boot rules are used.
      # REDIS_URL is required unconditionally by QueueModule (BullMQ) even in
      # test — without it the app crashes at Nest bootstrap before /health is
      # ever reachable, so this step never actually passed without it.
      - name: Backend E2E smoke test
        run: npx nx run backend-e2e:e2e --ci
        env:
          NODE_ENV: test
          HOST: localhost
          PORT: 3000
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: majalis_elm_test
          DATABASE_USER: majalis_elm
          DATABASE_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379


      # ── Security Audit ───────────────────────────────────────────────────────
      - name: npm audit (high severity)
        run: npm audit --audit-level=high
