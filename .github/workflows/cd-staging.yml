name: CD — Deploy to Staging

on:
  push:
    branches: [master]

concurrency:
  group: cd-staging
  cancel-in-progress: false   # never cancel a running deploy

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/majalis-elm-backend
  STAGING_API_URL: https://api-staging.majalis-elm.app

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://api-staging.majalis-elm.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/majalis-elm

            # Keep the deployment checkout exactly on the commit that triggered CD.
            git fetch origin master
            git reset --hard origin/master

            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"

            # Pull latest backend image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull backend

            # Ensure the custom PostgreSQL image (pg_uuidv7) is running before migrations.
            docker compose -f docker-compose.prod.yml up -d postgres
            docker compose -f docker-compose.prod.yml ps postgres

            # Run migrations (before swapping backend containers)
            docker compose -f docker-compose.prod.yml \
              run --rm backend node scripts/migrate.mjs

            # Start the backend and reverse proxy only after migrations succeed.
            docker compose -f docker-compose.prod.yml \
              up -d --no-build backend nginx

            # Health check post-deploy
            sleep 10
            curl -f "${{ env.STAGING_API_URL }}/health" || exit 1

            echo "✅ Staging deploy complete — $(date)"
