upstream backend {
  server backend:3000;
  keepalive 32;
}

# ── HTTP → HTTPS redirect (prod only) ─────────────────────────────────────────
# In dev, both 80 and 443 serve directly; TLS is termination is optional locally.
server {
  listen 80;
  server_name _;

  # Health check endpoint — accessible without TLS for Docker HEALTHCHECK
  location /health {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
  }

  location /ready {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
  }

  # In production, redirect all other traffic to HTTPS
  # Uncomment when TLS is configured:
  # location / {
  #   return 301 https://$host$request_uri;
  # }

  # Dev: forward all traffic to backend
  location / {
    include /etc/nginx/conf.d/proxy_params.conf;
    proxy_pass http://backend;
  }
}

